# Actualización BIMENSUAL de los datos guardados (data/snapshots). Decisión del dueño (30/10/2026): cada dos meses.
# Se ejecuta el día 1 de enero, marzo, mayo, julio, septiembre y noviembre (UTC), o a mano desde la pestaña Actions.
# No publica nada por sí sola: abre un PR con los cambios y un resumen para revisarlo y fusionarlo.
# Requisitos en GitHub (Settings): secreto COMTRADE_API_KEY (sin él, solo se actualiza Eurostat) y, en
# Actions > General > Workflow permissions, permitir que GitHub Actions cree pull requests.
name: Actualizar datos guardados

on:
  schedule:
    - cron: "23 4 1 */2 *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar datos de Eurostat y UN Comtrade
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: npm run datos:actualizar
      - name: Abrir un PR con los cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/snapshots)" ]; then echo "Sin cambios en los datos."; exit 0; fi
          FECHA=$(date -u +%Y-%m-%d)
          RAMA="datos/actualizacion-$FECHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMA"
          git add data/snapshots
          git commit -m "Datos guardados: actualización bimensual del $FECHA"
          git push origin "$RAMA"
          gh pr create --base main --head "$RAMA" --title "Datos guardados: actualización del $FECHA" --body-file data/snapshots/RESUMEN.md
